{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="{% block meta_description %}DataSieve profiles, audits, and cleans tabular datasets with deterministic rules and versioned cleaning.{% endblock %}">
  <title>{% block title %}DataSieve{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include "partials/icons.html" %}
  {% include "partials/messages.html" %}
  {% block body %}{% endblock %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
