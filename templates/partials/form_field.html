{% load ui_extras %}
{% if field.field.widget.input_type == "hidden" %}
  {{ field }}
{% else %}
  <div class="field {% if field.errors %}has-error{% endif %}">
    <label class="field-label" for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
    {{ field.errors }}
  </div>
{% endif %}
